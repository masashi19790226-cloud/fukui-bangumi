# Androidアプリ(APK)をビルドして「Releases」に置く
name: アプリをビルド

on:
  push:
    branches: [main]
    paths: ["app/**", "*.gradle.kts", "gradle/**", "gradle.properties", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: バージョンを決める
        run: |
          VER="$(grep '^appVersion=' gradle.properties | cut -d= -f2 | tr -d '\r ').${{ github.run_number }}"
          echo "VER=${VER}" >> "$GITHUB_ENV"
          echo "バージョン: ${VER}"

      - name: APKをビルド
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace -PversionCode=${{ github.run_number }}
          cp app/build/outputs/apk/debug/app-debug.apk "fukui-bangumi-v${VER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: fukui-bangumi-v${{ env.VER }}
          path: fukui-bangumi-v${{ env.VER }}.apk

      - name: Releases に公開
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: 福井番組表 v${{ env.VER }}
          body: スマホでこのページを開き、fukui-bangumi-v${{ env.VER }}.apk をダウンロードしてインストールしてください。
          files: fukui-bangumi-v${{ env.VER }}.apk
          make_latest: true
