# Androidアプリ(APK)をビルドして「Releases」に置く
name: アプリをビルド

on:
  push:
    branches: [main]
    paths: ["app/**", "*.gradle.kts", "gradle/**", "gradle.properties", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: APKをビルド
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          BASE_URL="https://${OWNER}.github.io/${REPO}/epg/"
          echo "番組データURL: ${BASE_URL}"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace -PepgBaseUrl="${BASE_URL}" -PversionCode=${{ github.run_number }}
          cp app/build/outputs/apk/debug/app-debug.apk fukui-bangumi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fukui-bangumi-apk
          path: fukui-bangumi.apk

      - name: Releases に公開
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 福井番組表 v1.0.${{ github.run_number }}
          body: スマホでこのページを開き、fukui-bangumi.apk をダウンロードしてインストールしてください。
          files: fukui-bangumi.apk
          make_latest: true
